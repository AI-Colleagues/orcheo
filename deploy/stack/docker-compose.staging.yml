x-orcheo-staging-build: &orcheo_staging_build
  context: ../..
  dockerfile: deploy/stack/Dockerfile.orcheo.staging

services:
  backend:
    image: orcheo-stack:staging-local
    build: *orcheo_staging_build

  worker:
    image: orcheo-stack:staging-local
    build: *orcheo_staging_build
    volumes:
      - orcheo_data:/data
      - ../../workspace/agents:/workspace/agents
      - ./chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro

  celery-beat:
    image: orcheo-stack:staging-local
    build: *orcheo_staging_build

  app-gateway:
    image: orcheo-stack:staging-local
    build: *orcheo_staging_build
    # The base stack publishes the gateway and starts it without a profile.

  validation-worker:
    image: orcheo-stack:staging-local
    build: *orcheo_staging_build
    # The base stack supplies the shared bundle volume and dedicated queue.

  hosted-app-cleanup:
    image: orcheo-stack:staging-local
    build: *orcheo_staging_build
    # The base stack supplies the writable shared bundle volume.

  studio:
    image: orcheo-studio:staging-local
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.studio.staging
