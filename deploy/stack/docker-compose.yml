name: orcheo
# Note: Services using 'env_file' load variables from ORCHEO_STACK_ENV_FILE when set,
# or from the project-local .env file otherwise.
# Environment variables explicitly defined in the 'environment' section take precedence
# over those from env_file. This allows overriding .env values when needed.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${ORCHEO_POSTGRES_LOCAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${ORCHEO_POSTGRES_USER:-orcheo}
      POSTGRES_PASSWORD: ${ORCHEO_POSTGRES_PASSWORD:?set ORCHEO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORCHEO_POSTGRES_DB:-orcheo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORCHEO_POSTGRES_USER:-orcheo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${ORCHEO_REDIS_LOCAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${ORCHEO_STACK_IMAGE:-ghcr.io/ai-colleagues/orcheo-stack:latest}
    env_file: ${ORCHEO_STACK_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${ORCHEO_BACKEND_LOCAL_PORT:-2025}:2025"
    volumes:
      - orcheo_data:/data
      - ./chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER}:${ORCHEO_POSTGRES_PASSWORD}@postgres:5432/${ORCHEO_POSTGRES_DB}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:?set ORCHEO_VAULT_ENCRYPTION_KEY}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWKS_URL: ${ORCHEO_AUTH_JWKS_URL:-}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_CORS_ALLOW_ORIGINS: ${ORCHEO_CORS_ALLOW_ORIGINS:-http://localhost:2026,http://127.0.0.1:2026}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_SANDBOX_RUNTIME_URL: ${ORCHEO_SANDBOX_RUNTIME_URL:-http://sandbox-runtime:9090}
      ORCHEO_CREDENTIAL_BROKER_SECRET: ${ORCHEO_CREDENTIAL_BROKER_SECRET:?set ORCHEO_CREDENTIAL_BROKER_SECRET}
      # Backend/worker embed this image name in every ContainerSpec they send
      # to sandbox-runtime, so it must match the image sandbox-runtime is
      # allowed to spawn.
      ORCHEO_SANDBOX_IMAGE: ${ORCHEO_SANDBOX_IMAGE:-ghcr.io/ai-colleagues/orcheo-workspace-sandbox:latest}
      ORCHEO_CONTAINER_RUNTIME: ${ORCHEO_CONTAINER_RUNTIME:-runsc}
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sandbox-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2025/api/system/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: >
      python -m uvicorn orcheo_backend.app:app
      --host 0.0.0.0
      --port 2025
      --proxy-headers

  worker:
    image: ${ORCHEO_STACK_IMAGE:-ghcr.io/ai-colleagues/orcheo-stack:latest}
    env_file: ${ORCHEO_STACK_ENV_FILE:-.env}
    volumes:
      - orcheo_data:/data
      - ./workspace/agents:/workspace/agents
      - ./chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER}:${ORCHEO_POSTGRES_PASSWORD}@postgres:5432/${ORCHEO_POSTGRES_DB}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:?set ORCHEO_VAULT_ENCRYPTION_KEY}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWKS_URL: ${ORCHEO_AUTH_JWKS_URL:-}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_BACKEND_INTERNAL_URL: http://backend:2025
      ORCHEO_SANDBOX_RUNTIME_URL: ${ORCHEO_SANDBOX_RUNTIME_URL:-http://sandbox-runtime:9090}
      ORCHEO_CREDENTIAL_BROKER_SECRET: ${ORCHEO_CREDENTIAL_BROKER_SECRET:?set ORCHEO_CREDENTIAL_BROKER_SECRET}
      # Backend/worker embed this image name in every ContainerSpec they send
      # to sandbox-runtime, so it must match the image sandbox-runtime is
      # allowed to spawn.
      ORCHEO_SANDBOX_IMAGE: ${ORCHEO_SANDBOX_IMAGE:-ghcr.io/ai-colleagues/orcheo-workspace-sandbox:latest}
      ORCHEO_CONTAINER_RUNTIME: ${ORCHEO_CONTAINER_RUNTIME:-runsc}
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sandbox-runtime:
        condition: service_healthy
    command: python -m celery -A orcheo_backend.worker.celery_app worker --loglevel=info

  celery-beat:
    image: ${ORCHEO_STACK_IMAGE:-ghcr.io/ai-colleagues/orcheo-stack:latest}
    env_file: ${ORCHEO_STACK_ENV_FILE:-.env}
    volumes:
      - orcheo_data:/data
      - ./chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER}:${ORCHEO_POSTGRES_PASSWORD}@postgres:5432/${ORCHEO_POSTGRES_DB}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:?set ORCHEO_VAULT_ENCRYPTION_KEY}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWKS_URL: ${ORCHEO_AUTH_JWKS_URL:-}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
      ORCHEO_CELERY_BEAT_SCHEDULE_FILE: /data/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      sh -c 'python -m celery -A orcheo_backend.worker.celery_app beat --loglevel=info -s "$$ORCHEO_CELERY_BEAT_SCHEDULE_FILE"'

  canvas:
    image: ${ORCHEO_CANVAS_IMAGE:-ghcr.io/ai-colleagues/orcheo-canvas:latest}
    env_file: ${ORCHEO_STACK_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${ORCHEO_CANVAS_LOCAL_PORT:-2026}:2026"
    environment:
      VITE_ORCHEO_BACKEND_URL: ${VITE_ORCHEO_BACKEND_URL:-http://localhost:2025}
      VITE_ORCHEO_AUTH_ISSUER: ${VITE_ORCHEO_AUTH_ISSUER:-${ORCHEO_AUTH_ISSUER:-}}
      VITE_ORCHEO_AUTH_CLIENT_ID: ${VITE_ORCHEO_AUTH_CLIENT_ID:-${ORCHEO_AUTH_CLIENT_ID:-}}
      VITE_ORCHEO_AUTH_REDIRECT_URI: ${VITE_ORCHEO_AUTH_REDIRECT_URI:-}
      VITE_ORCHEO_AUTH_SCOPES: ${VITE_ORCHEO_AUTH_SCOPES:-openid profile email workflows:read workflows:execute chatkit:session}
      VITE_ORCHEO_AUTH_AUDIENCE: ${VITE_ORCHEO_AUTH_AUDIENCE:-${ORCHEO_AUTH_AUDIENCE:-}}
      VITE_ORCHEO_AUTH_ORGANIZATION: ${VITE_ORCHEO_AUTH_ORGANIZATION:-}
      VITE_ORCHEO_AUTH_PROVIDER_PARAM: ${VITE_ORCHEO_AUTH_PROVIDER_PARAM:-}
      VITE_ORCHEO_AUTH_PROVIDER_GOOGLE: ${VITE_ORCHEO_AUTH_PROVIDER_GOOGLE:-}
      VITE_ORCHEO_AUTH_PROVIDER_GITHUB: ${VITE_ORCHEO_AUTH_PROVIDER_GITHUB:-}
      VITE_ORCHEO_AUTH_PROVIDER_EMAIL: ${VITE_ORCHEO_AUTH_PROVIDER_EMAIL:-Username-Password-Authentication}
      VITE_ORCHEO_CHATKIT_DOMAIN_KEY: ${VITE_ORCHEO_CHATKIT_DOMAIN_KEY:?set VITE_ORCHEO_CHATKIT_DOMAIN_KEY}
      VITE_ORCHEO_ALLOWED_HOSTS: ${VITE_ORCHEO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2026/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2
    profiles:
      - public-ingress
    env_file: ${ORCHEO_STACK_ENV_FILE:-.env}
    depends_on:
      backend:
        condition: service_healthy
      canvas:
        condition: service_healthy
    ports:
      - "${ORCHEO_CADDY_HTTP_BIND:-0.0.0.0}:80:80"
      - "${ORCHEO_CADDY_HTTPS_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  sandbox-runtime:
    # Sole service mounting the container-runtime socket. Treat as
    # root-equivalent on the host; never expose this socket to tenant code.
    image: ${ORCHEO_SANDBOX_RUNTIME_IMAGE:-ghcr.io/ai-colleagues/orcheo-sandbox-runtime:latest}
    restart: unless-stopped
    volumes:
      # Writable: the runtime calls `docker run` / `docker exec` to spawn
      # per-workspace sandbox children.
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_scratch:/scratch
    environment:
      ORCHEO_CONTAINER_RUNTIME: ${ORCHEO_CONTAINER_RUNTIME:-runsc}
      ORCHEO_SANDBOX_IMAGE: ${ORCHEO_SANDBOX_IMAGE:-ghcr.io/ai-colleagues/orcheo-workspace-sandbox:latest}
      ORCHEO_EGRESS_PROXY_URL: http://egress-proxy:3128
      ORCHEO_CREDENTIAL_BROKER_URL: http://backend:2025/internal/credentials/resolve
      ORCHEO_CREDENTIAL_BROKER_SECRET: ${ORCHEO_CREDENTIAL_BROKER_SECRET:?set ORCHEO_CREDENTIAL_BROKER_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - sandbox-egress

  egress-proxy:
    image: ${ORCHEO_EGRESS_PROXY_IMAGE:-envoyproxy/envoy:v1.33-latest}
    restart: unless-stopped
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ${ORCHEO_EGRESS_PROXY_CONFIG:-./envoy-forward-proxy.yaml}:/etc/envoy/envoy.yaml:ro
    networks:
      - sandbox-egress

networks:
  sandbox-egress:
    # Sandbox child containers are created through the host Docker API with
    # network_mode=sandbox-egress, so this must be the real Docker network
    # name rather than Compose's project-prefixed default.
    name: sandbox-egress
    # nftables rules attached to this bridge enforce the L3/L4 deny policy.
    # See deploy/stack/sandbox-egress.nft.
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  orcheo_data:
  caddy_data:
  caddy_config:
  sandbox_scratch:
