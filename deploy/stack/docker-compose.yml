name: orcheo
# Note: Services using 'env_file' load variables from ORCHEO_STACK_ENV_FILE when set,
# or from the project-local .env file otherwise.
# Environment variables explicitly defined in the 'environment' section take precedence
# over those from env_file. This allows overriding .env values when needed.

# Shared log rotation: keep the default json-file driver but cap each container's
# logs at ORCHEO_LOG_MAX_SIZE per file and ORCHEO_LOG_MAX_FILE rotated files.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${ORCHEO_LOG_MAX_SIZE:-10m}
    max-file: "${ORCHEO_LOG_MAX_FILE:-5}"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    ports:
      - "127.0.0.1:${ORCHEO_POSTGRES_LOCAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${ORCHEO_POSTGRES_USER:-orcheo}
      POSTGRES_PASSWORD: ${ORCHEO_POSTGRES_PASSWORD:?set ORCHEO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORCHEO_POSTGRES_DB:-orcheo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORCHEO_POSTGRES_USER:-orcheo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    logging: *default-logging
    ports:
      - "127.0.0.1:${ORCHEO_REDIS_LOCAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${ORCHEO_STACK_IMAGE:-ghcr.io/ai-colleagues/orcheo-stack:latest}
    env_file: ${ORCHEO_STACK_ENV_FILE:-.env}
    logging: *default-logging
    ports:
      - "127.0.0.1:${ORCHEO_BACKEND_LOCAL_PORT:-2025}:2025"
    volumes:
      - orcheo_data:/data
      - ./chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER}:${ORCHEO_POSTGRES_PASSWORD}@postgres:5432/${ORCHEO_POSTGRES_DB}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:?set ORCHEO_VAULT_ENCRYPTION_KEY}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWT_SECRET: ${ORCHEO_AUTH_JWT_SECRET:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-https://auth.orcheo.cloud}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-orcheo-api}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_SMTP_HOST: ${ORCHEO_SMTP_HOST:-}
      ORCHEO_SMTP_PORT: ${ORCHEO_SMTP_PORT:-587}
      ORCHEO_SMTP_USERNAME: ${ORCHEO_SMTP_USERNAME:-}
      ORCHEO_SMTP_PASSWORD: ${ORCHEO_SMTP_PASSWORD:-}
      ORCHEO_SMTP_FROM_EMAIL: ${ORCHEO_SMTP_FROM_EMAIL:-no-reply@orcheo.cloud}
      ORCHEO_SMTP_USE_TLS: ${ORCHEO_SMTP_USE_TLS:-true}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_CORS_ALLOW_ORIGINS: ${ORCHEO_CORS_ALLOW_ORIGINS:-http://localhost:2026,http://127.0.0.1:2026}
      ORCHEO_CANDIDATES_REPO: ${ORCHEO_CANDIDATES_REPO:-}
      ORCHEO_CANDIDATES_REPO_REF: ${ORCHEO_CANDIDATES_REPO_REF:-}
      ORCHEO_CANDIDATES_GITHUB_TOKEN: ${ORCHEO_CANDIDATES_GITHUB_TOKEN:-}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_WORKFLOW_TRUST_MODE: ${ORCHEO_WORKFLOW_TRUST_MODE:-}
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2025/api/system/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: >
      python -m uvicorn orcheo_backend.app:app
      --host 0.0.0.0
      --port 2025
      --proxy-headers

  worker:
    image: ${ORCHEO_STACK_IMAGE:-ghcr.io/ai-colleagues/orcheo-stack:latest}
    env_file: ${ORCHEO_STACK_ENV_FILE:-.env}
    logging: *default-logging
    volumes:
      - orcheo_data:/data
      - ./workspace/agents:/workspace/agents
      - ./chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER}:${ORCHEO_POSTGRES_PASSWORD}@postgres:5432/${ORCHEO_POSTGRES_DB}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:?set ORCHEO_VAULT_ENCRYPTION_KEY}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWT_SECRET: ${ORCHEO_AUTH_JWT_SECRET:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-https://auth.orcheo.cloud}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-orcheo-api}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_SMTP_HOST: ${ORCHEO_SMTP_HOST:-}
      ORCHEO_SMTP_PORT: ${ORCHEO_SMTP_PORT:-587}
      ORCHEO_SMTP_USERNAME: ${ORCHEO_SMTP_USERNAME:-}
      ORCHEO_SMTP_PASSWORD: ${ORCHEO_SMTP_PASSWORD:-}
      ORCHEO_SMTP_FROM_EMAIL: ${ORCHEO_SMTP_FROM_EMAIL:-no-reply@orcheo.cloud}
      ORCHEO_SMTP_USE_TLS: ${ORCHEO_SMTP_USE_TLS:-true}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_CANDIDATES_REPO: ${ORCHEO_CANDIDATES_REPO:-}
      ORCHEO_CANDIDATES_REPO_REF: ${ORCHEO_CANDIDATES_REPO_REF:-}
      ORCHEO_CANDIDATES_GITHUB_TOKEN: ${ORCHEO_CANDIDATES_GITHUB_TOKEN:-}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_BACKEND_INTERNAL_URL: http://backend:2025
      ORCHEO_WORKFLOW_TRUST_MODE: ${ORCHEO_WORKFLOW_TRUST_MODE:-}
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: python -m celery -A orcheo_backend.worker.celery_app worker --loglevel=info

  celery-beat:
    image: ${ORCHEO_STACK_IMAGE:-ghcr.io/ai-colleagues/orcheo-stack:latest}
    env_file: ${ORCHEO_STACK_ENV_FILE:-.env}
    logging: *default-logging
    volumes:
      - orcheo_data:/data
      - ./chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER}:${ORCHEO_POSTGRES_PASSWORD}@postgres:5432/${ORCHEO_POSTGRES_DB}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:?set ORCHEO_VAULT_ENCRYPTION_KEY}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWT_SECRET: ${ORCHEO_AUTH_JWT_SECRET:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-https://auth.orcheo.cloud}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-orcheo-api}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_SMTP_HOST: ${ORCHEO_SMTP_HOST:-}
      ORCHEO_SMTP_PORT: ${ORCHEO_SMTP_PORT:-587}
      ORCHEO_SMTP_USERNAME: ${ORCHEO_SMTP_USERNAME:-}
      ORCHEO_SMTP_PASSWORD: ${ORCHEO_SMTP_PASSWORD:-}
      ORCHEO_SMTP_FROM_EMAIL: ${ORCHEO_SMTP_FROM_EMAIL:-no-reply@orcheo.cloud}
      ORCHEO_SMTP_USE_TLS: ${ORCHEO_SMTP_USE_TLS:-true}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_CANDIDATES_REPO: ${ORCHEO_CANDIDATES_REPO:-}
      ORCHEO_CANDIDATES_REPO_REF: ${ORCHEO_CANDIDATES_REPO_REF:-}
      ORCHEO_CANDIDATES_GITHUB_TOKEN: ${ORCHEO_CANDIDATES_GITHUB_TOKEN:-}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
      ORCHEO_CELERY_BEAT_SCHEDULE_FILE: /data/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      sh -c 'python -m celery -A orcheo_backend.worker.celery_app beat --loglevel=info -s "$$ORCHEO_CELERY_BEAT_SCHEDULE_FILE"'

  studio:
    image: ${ORCHEO_STUDIO_IMAGE:-ghcr.io/ai-colleagues/orcheo-studio:latest}
    env_file: ${ORCHEO_STACK_ENV_FILE:-.env}
    logging: *default-logging
    ports:
      - "127.0.0.1:${ORCHEO_STUDIO_LOCAL_PORT:-2026}:2026"
    environment:
      VITE_ORCHEO_BACKEND_URL: ${VITE_ORCHEO_BACKEND_URL:-http://localhost:2025}
      VITE_ORCHEO_AUTH_DISABLED: ${VITE_ORCHEO_AUTH_DISABLED:-false}
      VITE_ORCHEO_CHATKIT_DOMAIN_KEY: ${VITE_ORCHEO_CHATKIT_DOMAIN_KEY:-domain_pk_replace_me}
      VITE_ORCHEO_ALLOWED_HOSTS: ${VITE_ORCHEO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2026/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2
    logging: *default-logging
    profiles:
      - public-ingress
    env_file: ${ORCHEO_STACK_ENV_FILE:-.env}
    depends_on:
      backend:
        condition: service_healthy
      studio:
        condition: service_healthy
    ports:
      - "${ORCHEO_CADDY_HTTP_BIND:-0.0.0.0}:80:80"
      - "${ORCHEO_CADDY_HTTPS_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  orcheo_data:
  caddy_data:
  caddy_config:
