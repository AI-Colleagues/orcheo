[bumpversion]
current_version = 0.28.5
commit = false
tag = false
message = Bump stack version to {new_version}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:-(?P<prerel>alpha|beta|rc)\.(?P<prerel_num>\d+))?
serialize =
	{major}.{minor}.{patch}-{prerel}.{prerel_num}
	{major}.{minor}.{patch}

[bumpversion:part:prerel]
values =
	alpha
	beta
	rc
	final
optional_value = final

[bumpversion:part:prerel_num]
first_value = 1
