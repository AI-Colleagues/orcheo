name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.cursor/**'
      - '.cursorrules'
      - '.cursorignore'
      - '.devcontainer/**'
      - '.readthedocs.yaml'
      - 'mkdocs.yml'
      - '.github/ISSUE_TEMPLATE/**'
    tags:
      - 'core-v*'
      - 'backend-v*'
      - 'sdk-v*'
      - 'agentensor-v*'
      - 'studio-v*'
      - 'stack-v*'
      - 'desktop-v*'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.cursor/**'
      - '.cursorrules'
      - '.cursorignore'
      - '.devcontainer/**'
      - '.readthedocs.yaml'
      - 'mkdocs.yml'
      - '.github/ISSUE_TEMPLATE/**'
    types:
      - opened
      - synchronize
      - ready_for_review

permissions:
  id-token: write  # Required for PyPI trusted publishing
  contents: read

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check style against standards
        run: uv run make lint

  app-gateway:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: uv sync --all-packages --all-groups

      - name: Lint and type-check gateway
        run: |
          uv run ruff check apps/app_gateway/src src/orcheo/hosted_apps tests/hosted_apps
          uv run mypy apps/app_gateway/src/orcheo_app_gateway src/orcheo/hosted_apps/gateway.py

      - name: Test gateway and Hosted Apps security contracts
        run: uv run pytest tests/hosted_apps -q

      - name: Build gateway-containing stack image
        run: docker build -f Dockerfile.backend -t orcheo-app-gateway:${{ github.sha }} .

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: orcheo-app-gateway:${{ github.sha }}
          artifact-name: app-gateway-sbom.spdx.json
          format: spdx-json

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: orcheo-app-gateway:${{ github.sha }}
          format: sarif
          output: app-gateway-trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload vulnerability results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app-gateway-trivy.sarif

  coverage-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: backend
            paths: tests/backend
          - shard: nodes
            paths: tests/nodes
          - shard: sdk
            paths: tests/sdk
          - shard: core
            paths: >-
              tests/graph tests/listeners tests/triggers tests/triggers_layer
              tests/runtime tests/sandbox tests/workspace tests/agentensor
              tests/plugins tests/config tests/edges tests/identity
              tests/integration tests/widgets tests/security tests/test_*.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run unit tests with coverage
        env:
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: uv run pytest ${{ matrix.paths }} --cov --cov-context=test --cov-report= -n auto

      - name: Store coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true

  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: coverage-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Build coverage reports
        run: |
          uv run coverage combine coverage-data
          uv run coverage html --show-contexts --title "Coverage for ${{ github.sha }}"
          uv run coverage xml
          uv run diff-cover coverage.xml --format html:index.html

      - name: Store coverage html
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          include-hidden-files: true

      - name: Store diff coverage html
        uses: actions/upload-artifact@v4
        with:
          name: diff-coverage-html
          path: index.html

      - name: Check coverage
        run: |
          uv run coverage report --fail-under 95
          uv run diff-cover coverage.xml --fail-under 100

  postgres-persistence:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Postgres persistence checks
        env:
          # Use a numeric address so psycopg never enters an unbounded DNS lookup.
          ORCHEO_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          ORCHEO_CHECKPOINT_BACKEND: postgres
          ORCHEO_TEST_POSTGRES_PERSISTENCE: "1"
        run: |
          uv run pytest tests/integration/test_postgres_persistence.py -vv \
            -o faulthandler_timeout=60

  build-and-release:
    needs: [lint, coverage, postgres-persistence]
    if: "startsWith(github.ref, 'refs/tags/core-v') || startsWith(github.ref, 'refs/tags/backend-v') || startsWith(github.ref, 'refs/tags/sdk-v') || startsWith(github.ref, 'refs/tags/agentensor-v')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Determine package context
        id: package
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == core-v* ]]; then
            echo "package=orcheo" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == backend-v* ]]; then
            echo "package=orcheo-backend" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == sdk-v* ]]; then
            echo "package=orcheo-sdk" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == agentensor-v* ]]; then
            echo "package=agentensor" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported tag prefix: $tag" >&2
            exit 1
          fi
          echo "dist_dir=dist/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build ${{ steps.package.outputs.package }}
        run: |
          uv build --package "${{ steps.package.outputs.package }}" --out-dir "${{ steps.package.outputs.dist_dir }}"

      - name: Publish ${{ steps.package.outputs.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ steps.package.outputs.dist_dir }}

  stack-image-metadata:
    needs: [lint, coverage]
    if: "startsWith(github.ref, 'refs/tags/stack-v')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stack_repo: ${{ steps.meta.outputs.stack_repo }}
      studio_repo: ${{ steps.meta.outputs.studio_repo }}
    steps:
      - name: Determine image metadata
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#stack-v}"
          if [[ "$version" == "$tag" || -z "$version" ]]; then
            echo "Invalid stack tag: $tag" >&2
            exit 1
          fi
          owner_lc=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "stack_repo=ghcr.io/${owner_lc}/orcheo-stack" >> "$GITHUB_OUTPUT"
          echo "studio_repo=ghcr.io/${owner_lc}/orcheo-studio" >> "$GITHUB_OUTPUT"

  image-build:
    needs: [stack-image-metadata]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: stack
            context: deploy/stack
            file: deploy/stack/Dockerfile.orcheo
            repo: ${{ needs.stack-image-metadata.outputs.stack_repo }}
          - name: studio
            context: deploy/stack
            file: deploy/stack/Dockerfile.studio
            repo: ${{ needs.stack-image-metadata.outputs.studio_repo }}
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }} by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ matrix.image.repo }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}-${{ github.run_attempt }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    needs: [stack-image-metadata, image-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: stack
            repo: ${{ needs.stack-image-metadata.outputs.stack_repo }}
          - name: studio
            repo: ${{ needs.stack-image-metadata.outputs.studio_repo }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image.name }}-*-${{ github.run_attempt }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          repo="${{ matrix.image.repo }}"
          version="${{ needs.stack-image-metadata.outputs.version }}"
          docker buildx imagetools create \
            -t "${repo}:${version}" \
            -t "${repo}:latest" \
            $(printf "${repo}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ matrix.image.repo }}:${{ needs.stack-image-metadata.outputs.version }}"

  studio:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          token: ""
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1
      - name: Install dependencies
        run: |
          npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --run

  studio-build-and-release:
    needs: [studio]
    if: "startsWith(github.ref, 'refs/tags/studio-v')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    permissions:
      contents: read
      id-token: write  # Required for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1
      - name: Install dependencies
        run: |
          npm ci
      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#studio-v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [[ "$version" != "$pkg_version" ]]; then
            echo "Error: Tag version ($version) does not match package.json version ($pkg_version)" >&2
            exit 1
          fi
          echo "Version check passed: $version"
      - name: Build
        run: npm run build
      - name: Publish to npm
        run: npm publish --provenance --access public

  desktop-tauri-release:
    needs: [lint, coverage, postgres-persistence, studio]
    if: "startsWith(github.ref, 'refs/tags/desktop-v')"
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/studio/package-lock.json
            apps/desktop/tauri/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/tauri/src-tauri -> target

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"

      - name: Install dependencies
        run: |
          npm ci --prefix apps/desktop/tauri

      - name: Verify desktop version matches tag
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          pkg_version=$(node -p "require('./apps/desktop/tauri/package.json').version")
          tauri_version=$(node -p "require('./apps/desktop/tauri/src-tauri/tauri.conf.json').version")
          if [[ "$version" != "$pkg_version" ]]; then
            echo "Error: Tag version ($version) does not match package.json version ($pkg_version)" >&2
            exit 1
          fi
          if [[ "$version" != "$tauri_version" ]]; then
            echo "Error: Tag version ($version) does not match tauri.conf.json version ($tauri_version)" >&2
            exit 1
          fi
          echo "Version check passed: $version"

      - name: Build Apple Silicon DMG
        env:
          ORCHEO_TAURI_USE_PUBLISHED_RELEASES: "true"
        run: npm --prefix apps/desktop/tauri run build:dmg

      - name: Stage DMG release asset
        run: |
          mkdir -p dist/desktop-tauri
          find apps/desktop/tauri/src-tauri/target/release/bundle/dmg \
            -maxdepth 1 \
            -type f \
            -name '*.dmg' \
            -exec cp {} dist/desktop-tauri/ \;
          dmg_count=$(find dist/desktop-tauri -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          if [[ "$dmg_count" -eq 0 ]]; then
            echo "No DMG files were produced." >&2
            exit 1
          fi
          if find dist/desktop-tauri -maxdepth 1 -type f ! -name '*.dmg' | grep -q .; then
            echo "Only DMG files may be staged as desktop release assets." >&2
            find dist/desktop-tauri -maxdepth 1 -type f >&2
            exit 1
          fi
          ls -lh dist/desktop-tauri

      - name: Upload DMG to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          fail_on_unmatched_files: true
          files: dist/desktop-tauri/*.dmg
          name: Orcheo Desktop ${{ github.ref_name }}
          body: See the DMG asset below to download Orcheo Desktop for Apple Silicon.
