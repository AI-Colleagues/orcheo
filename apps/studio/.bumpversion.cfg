[bumpversion]
current_version = 0.25.0-alpha.3
commit = true
tag = true
tag_name = studio-v{new_version}
message = Bump studio version to {new_version}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:-(?P<prerel>alpha|beta|rc)\.(?P<prerel_num>\d+))?
serialize = {major}.{minor}.{patch}-{prerel}.{prerel_num}
	{major}.{minor}.{patch}

[bumpversion:part:prerel]
values = alpha
	beta
	rc
	final
optional_value = final

[bumpversion:part:prerel_num]
first_value = 1

[bumpversion:file:package.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:package-lock.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"
