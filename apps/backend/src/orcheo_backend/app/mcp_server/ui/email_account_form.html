<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orcheo email accounts</title>
    <style>
      :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; --border:#d9d9d9; --field:#fff; --accent:#3b5bdb; --accent-fg:#fff; --danger:#c92a2a; --success:#2b8a3e; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1c1e; --fg:#f1f1f1; --muted:#a0a0a5; --border:#3a3a3c; --field:#2c2c2e; --accent:#748ffc; --accent-fg:#0b0b0b; --danger:#ff8787; --success:#8ce99a; } }
      :root[data-theme="dark"] { --bg:#1c1c1e; --fg:#f1f1f1; --muted:#a0a0a5; --border:#3a3a3c; --field:#2c2c2e; --accent:#748ffc; --accent-fg:#0b0b0b; --danger:#ff8787; --success:#8ce99a; }
      * { box-sizing:border-box; } body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
      h1 { font-size:17px; margin:0 0 4px; } h2 { font-size:14px; margin:14px 0 4px; } p.hint { color:var(--muted); margin:0 0 14px; }
      #layout { display:grid; gap:12px; max-width:700px; } #selector { display:flex; gap:8px; }
      label { display:grid; gap:4px; font-weight:500; } label span.note { color:var(--muted); font-weight:400; font-size:12px; }
      input,select,textarea { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--field); color:var(--fg); font:inherit; }
      textarea { min-height:70px; resize:vertical; } .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .wide { grid-column:1/-1; }
      .actions { display:flex; flex-wrap:wrap; gap:8px; } button { padding:8px 12px; border-radius:6px; border:1px solid var(--border); background:var(--field); color:var(--fg); font:inherit; cursor:pointer; }
      button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:600; } button.danger { color:var(--danger); } button:disabled { opacity:.6; cursor:default; }
      #status { min-height:20px; margin:0; } #status.error { color:var(--danger); } #status.success { color:var(--success); }
      .checks { display:flex; gap:18px; align-items:center; } .checks label { display:flex; align-items:center; gap:7px; font-weight:400; } .checks input { width:auto; }
      @media(max-width:520px) { .grid { grid-template-columns:1fr; } .wide { grid-column:auto; } }
    </style>
  </head>
  <body>
    <div id="layout">
      <div>
        <h1>Email accounts</h1>
        <p class="hint">Mailbox server settings and passwords are saved as encrypted credentials in your Orcheo vault.</p>
      </div>
      <div id="selector">
        <label style="flex:1">Linked mailbox
          <select id="account-select"><option value="">Add a mailbox</option></select>
        </label>
        <button id="new-account" type="button">Add mailbox</button>
      </div>
      <div class="grid">
        <label>Display name<input id="display-name" maxlength="100" /></label>
        <label>Email address<input id="email-address" type="email" maxlength="320" /></label>
        <label class="wide">Labels <span class="note">Separate labels with commas.</span><input id="labels" /></label>
      </div>
      <div class="checks">
        <label><input id="is-default" type="checkbox" />Default mailbox</label>
        <label><input id="enabled" type="checkbox" checked />Enabled</label>
        <label><input id="save-sent-copy" type="checkbox" checked />Save sent copy</label>
      </div>
      <div class="grid">
        <div class="wide"><h2>IMAP (incoming mail)</h2></div>
        <label>Server<input id="imap-host" placeholder="imap.example.com" /></label>
        <label>Port<input id="imap-port" type="number" min="1" max="65535" value="993" /></label>
        <label>Security<select id="imap-security"><option value="ssl">SSL/TLS</option><option value="starttls">STARTTLS</option></select></label>
        <label>Username<input id="imap-username" autocomplete="username" /></label>
        <label class="wide">Password<input id="imap-password" type="password" autocomplete="new-password" placeholder="Enter to replace the saved password" /></label>
        <div class="wide"><h2>SMTP (outgoing mail)</h2></div>
        <label>Server<input id="smtp-host" placeholder="smtp.example.com" /></label>
        <label>Port<input id="smtp-port" type="number" min="1" max="65535" value="465" /></label>
        <label>Security<select id="smtp-security"><option value="ssl">SSL/TLS</option><option value="starttls">STARTTLS</option></select></label>
        <label>Username<input id="smtp-username" autocomplete="username" /></label>
        <label class="wide">Password<input id="smtp-password" type="password" autocomplete="new-password" placeholder="Enter to replace the saved password" /></label>
        <label class="wide">Signature<textarea id="signature" maxlength="2000"></textarea></label>
      </div>
      <div class="actions">
        <button class="primary" id="save" type="button">Save mailbox</button>
        <button id="test" type="button">Test IMAP and SMTP</button>
        <button class="danger" id="delete" type="button">Remove mailbox</button>
      </div>
      <p id="status" role="status"></p>
    </div>
    <script>/* ORCHEO_BRIDGE */</script>
    <script>
      const $ = (id) => document.getElementById(id);
      let form = null;
      let accounts = [];
      let activeAccountId = null;
      const setStatus = (text, kind = "") => { $("status").textContent = text; $("status").className = kind; };
      const value = (id) => $(id).value.trim();
      const setValue = (id, item) => { $(id).value = item ?? ""; };
      const call = async (name, args) => {
        const result = await orcheoBridge.callTool(name, args);
        if (result.isError) throw new Error(result.content?.[0]?.text || "Email account operation failed.");
        return result.structuredContent || {};
      };
      const selected = () => accounts.find((item) => item.account_id === $("account-select").value);
      const showAccount = (account) => {
        const imap = account?.imap || {};
        const smtp = account?.smtp || {};
        activeAccountId = account?.account_id || null;
        setValue("display-name", account?.display_name);
        setValue("email-address", account?.email_address);
        setValue("labels", (account?.labels || []).join(", "));
        $("is-default").checked = Boolean(account?.is_default);
        $("enabled").checked = account ? Boolean(account.enabled) : true;
        $("save-sent-copy").checked = account ? Boolean(account.save_sent_copy) : true;
        setValue("imap-host", imap.host); setValue("imap-port", imap.port ?? 993);
        setValue("imap-security", imap.security || "ssl"); setValue("imap-username", imap.username);
        setValue("smtp-host", smtp.host); setValue("smtp-port", smtp.port ?? 465);
        setValue("smtp-security", smtp.security || "ssl"); setValue("smtp-username", smtp.username);
        setValue("signature", account?.signature_text);
        $("imap-password").value = ""; $("smtp-password").value = "";
        $("imap-password").placeholder = account ? "Leave blank to keep the saved password" : "Required";
        $("smtp-password").placeholder = account ? "Leave blank to keep the saved password" : "Required";
        $("delete").disabled = !account;
        $("test").disabled = !account;
      };
      const loadSettings = async (accountId) => {
        if (!accountId) { showAccount(null); return; }
        setStatus("Loading mailbox settings…");
        const result = await call("get_email_account_settings", { form_token: form.token, account_id: accountId });
        showAccount(result.account);
        setStatus("");
      };
      const load = async (result) => {
        const data = result.structuredContent || {};
        const meta = result._meta || {};
        form = { token: meta["orcheo/formToken"] };
        accounts = data.accounts || [];
        const select = $("account-select");
        select.replaceChildren(new Option("Add a mailbox", ""));
        accounts.forEach((item) => select.add(new Option(`${item.display_name} · ${item.email_address}${item.is_default ? " · default" : ""}`, item.account_id)));
        const requested = data.account_id || "";
        select.value = accounts.some((item) => item.account_id === requested) ? requested : "";
        $("save").disabled = !form.token;
        $("new-account").disabled = !form.token;
        if (!form.token) { setStatus("This form could not be verified.", "error"); return; }
        try { await loadSettings(select.value); } catch (error) { setStatus(error.message, "error"); }
      };
      $("account-select").addEventListener("change", async () => {
        try { await loadSettings($("account-select").value); } catch (error) { setStatus(error.message, "error"); }
      });
      $("new-account").addEventListener("click", () => { $("account-select").value = ""; showAccount(null); setStatus(""); });
      $("save").addEventListener("click", async () => {
        if (!form?.token) return;
        const payload = {
          form_token: form.token,
          ...(activeAccountId ? { account_id: activeAccountId } : {}),
          display_name: value("display-name"), email_address: value("email-address"),
          labels: value("labels").split(",").map((item) => item.trim()).filter(Boolean),
          is_default: $("is-default").checked, enabled: $("enabled").checked,
          signature_text: value("signature"), save_sent_copy: $("save-sent-copy").checked,
          imap: { host: value("imap-host"), port: Number(value("imap-port")), security: value("imap-security"), username: value("imap-username"), ...(value("imap-password") ? { password: value("imap-password") } : {}) },
          smtp: { host: value("smtp-host"), port: Number(value("smtp-port")), security: value("smtp-security"), username: value("smtp-username"), ...(value("smtp-password") ? { password: value("smtp-password") } : {}) },
        };
        $("save").disabled = true; setStatus("Saving encrypted mailbox settings…");
        try {
          const result = await call("save_email_account", payload);
          const account = result.account;
          accounts = accounts.filter((item) => item.account_id !== account.account_id);
          accounts.push({ account_id: account.account_id, display_name: account.display_name, email_address: account.email_address, labels: account.labels, is_default: account.is_default, enabled: account.enabled, save_sent_copy: account.save_sent_copy, has_signature: Boolean(account.signature_text), health: { imap: account.imap, smtp: account.smtp } });
          const select = $("account-select"); select.replaceChildren(new Option("Add a mailbox", ""));
          accounts.forEach((item) => select.add(new Option(`${item.display_name} · ${item.email_address}${item.is_default ? " · default" : ""}`, item.account_id)));
          select.value = account.account_id; showAccount(account);
          $("imap-password").value = ""; $("smtp-password").value = "";
          setStatus("Mailbox settings saved in the Orcheo vault.", "success");
          await orcheoBridge.tellModel(`The user saved email account ${account.email_address} in the Orcheo vault.`);
        } catch (error) { setStatus(error.message, "error"); }
        finally { $("save").disabled = false; }
      });
      $("test").addEventListener("click", async () => {
        if (!form?.token || !activeAccountId) return;
        $("test").disabled = true; setStatus("Testing IMAP and SMTP…");
        try {
          const result = await call("test_email_account", { form_token: form.token, account_id: activeAccountId, protocol: "both" });
          const outcomes = Object.entries(result.connections || {}).map(([name, item]) => `${name.toUpperCase()}: ${item.status}`).join(" · ");
          setStatus(outcomes || "Connection test finished.", "success");
        } catch (error) { setStatus(error.message, "error"); }
        finally { $("test").disabled = false; }
      });
      $("delete").addEventListener("click", async () => {
        if (!form?.token || !activeAccountId || !window.confirm("Remove this mailbox and its vault credentials?")) return;
        $("delete").disabled = true; setStatus("Removing mailbox…");
        try {
          await call("delete_email_account", { form_token: form.token, account_id: activeAccountId });
          accounts = accounts.filter((item) => item.account_id !== activeAccountId);
          const select = $("account-select"); select.replaceChildren(new Option("Add a mailbox", ""));
          accounts.forEach((item) => select.add(new Option(`${item.display_name} · ${item.email_address}${item.is_default ? " · default" : ""}`, item.account_id)));
          select.value = ""; showAccount(null); setStatus("Mailbox and vault credential removed.", "success");
          await orcheoBridge.tellModel("The user removed an email account from the Orcheo vault.");
        } catch (error) { setStatus(error.message, "error"); }
        finally { $("delete").disabled = false; }
      });
      orcheoBridge.on("ui/notifications/tool-result", load);
      orcheoBridge.connect("orcheo-email-account-form");
    </script>
  </body>
</html>
