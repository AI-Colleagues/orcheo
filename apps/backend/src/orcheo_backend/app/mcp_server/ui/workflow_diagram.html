<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orcheo workflow</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --border: #d9d9d9;
        --danger: #c92a2a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c1c1e;
          --fg: #f1f1f1;
          --muted: #a0a0a5;
          --border: #3a3a3c;
          --danger: #ff8787;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c1c1e;
        --fg: #f1f1f1;
        --muted: #a0a0a5;
        --border: #3a3a3c;
        --danger: #ff8787;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
      h1 { font-size: 16px; margin: 0; }
      #version { color: var(--muted); }
      #diagram { overflow-x: auto; text-align: center; }
      #diagram svg { max-width: 100%; height: auto; }
      pre {
        margin: 0;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow-x: auto;
        font-size: 12px;
      }
      #status { color: var(--muted); margin: 8px 0 0; }
      #status.error { color: var(--danger); }
    </style>
  </head>
  <body>
    <header>
      <h1 id="name">Workflow</h1>
      <span id="version"></span>
    </header>
    <div id="diagram"></div>
    <p id="status">Loading diagram…</p>
    <script>
      /* ORCHEO_BRIDGE */
    </script>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      // The host sends the diagram in ui/notifications/tool-result, which it
      // only has to do while the tool runs, so a restored view can receive
      // nothing at all; say so instead of loading forever.
      const DATA_TIMEOUT_MS = 8000;
      // The source stays readable without the renderer, so a stalled CDN
      // falls back to it rather than holding the diagram back.
      const RENDERER_TIMEOUT_MS = 10000;
      const MERMAID_URL =
        "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      const REOPEN = "Ask the assistant to show it again.";
      let source = null;
      let theme = "default";
      let delivered = false;

      const setStatus = (text, kind = "") => {
        $("status").textContent = text;
        $("status").className = kind;
      };

      const stalled = setTimeout(() => {
        if (!delivered) {
          setStatus(`This diagram never received its data. ${REOPEN}`, "error");
        }
      }, DATA_TIMEOUT_MS);

      const settle = () => {
        delivered = true;
        clearTimeout(stalled);
      };

      const fail = (reason) => {
        if (delivered) return;
        settle();
        setStatus(`${reason} ${REOPEN}`, "error");
      };

      // Start loading the renderer now, but never make the handshake wait
      // for it: the host only sends the diagram once the view has connected.
      const renderer = Promise.race([
        import(MERMAID_URL).then((module) => module.default),
        new Promise((done) => setTimeout(() => done(null), RENDERER_TIMEOUT_MS)),
      ]).catch(() => null);

      const showSource = (message) => {
        const pre = document.createElement("pre");
        pre.textContent = source || "";
        $("diagram").replaceChildren(pre);
        setStatus(message, "error");
      };

      const render = async () => {
        if (!source) return;
        const mermaid = await renderer;
        if (!mermaid) {
          showSource("The diagram renderer could not be loaded; showing its source.");
          return;
        }
        try {
          mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme });
          const { svg } = await mermaid.render(`graph-${Date.now()}`, source);
          $("diagram").innerHTML = svg;
          setStatus("");
        } catch (error) {
          showSource(`The diagram could not be rendered: ${error.message}`);
        }
      };

      orcheoBridge.on("ui/notifications/tool-result", (result) => {
        settle();
        const data = result.structuredContent || {};
        $("name").textContent = data.name || "Workflow";
        $("version").textContent = data.version ? `v${data.version}` : "";
        source = data.mermaid;
        render();
      });
      orcheoBridge.on("ui/notifications/tool-cancelled", () =>
        fail("Showing this diagram was cancelled."),
      );
      orcheoBridge.on("ui/notifications/host-context-changed", (context) => {
        if (!context.theme) return;
        theme = context.theme === "dark" ? "dark" : "default";
        render();
      });

      orcheoBridge
        .connect("orcheo-workflow-diagram")
        .then((init) => {
          if (init && init.hostContext && init.hostContext.theme === "dark") {
            theme = "dark";
            render();
          }
        })
        .catch(() => fail("This diagram could not reach the app host."));
    </script>
  </body>
</html>
