<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orcheo credential</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --border: #d9d9d9;
        --field: #ffffff;
        --accent: #3b5bdb;
        --accent-fg: #ffffff;
        --danger: #c92a2a;
        --success: #2b8a3e;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c1c1e;
          --fg: #f1f1f1;
          --muted: #a0a0a5;
          --border: #3a3a3c;
          --field: #2c2c2e;
          --accent: #748ffc;
          --accent-fg: #0b0b0b;
          --danger: #ff8787;
          --success: #8ce99a;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c1c1e;
        --fg: #f1f1f1;
        --muted: #a0a0a5;
        --border: #3a3a3c;
        --field: #2c2c2e;
        --accent: #748ffc;
        --accent-fg: #0b0b0b;
        --danger: #ff8787;
        --success: #8ce99a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p.hint { color: var(--muted); margin: 0 0 16px; }
      #form { display: grid; gap: 12px; max-width: 460px; }
      label { display: grid; gap: 4px; font-weight: 500; }
      label span.note { color: var(--muted); font-weight: 400; font-size: 12px; }
      input, select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--field);
        color: var(--fg);
        font: inherit;
      }
      .secret { display: flex; gap: 6px; }
      .secret input { flex: 1; }
      button {
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--field);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
        font-weight: 600;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      #status { min-height: 20px; margin: 0; }
      #status.error { color: var(--danger); }
      #status.success { color: var(--success); }
    </style>
  </head>
  <body>
    <h1 id="title">Add credential</h1>
    <p class="hint">
      The secret goes straight to your Orcheo vault. The AI assistant never
      sees it.
    </p>
    <!-- Not a <form>: hosts sandbox views without allow-forms, which blocks
         form submission entirely. -->
    <div id="form">
      <label>Name
        <input id="name" placeholder="openai_api_key" />
        <span class="note">Workflows reference it as [[name]].</span>
      </label>
      <label>Provider
        <input id="provider" placeholder="openai" />
      </label>
      <label>Access
        <select id="access">
          <option value="shared">Shared with every workflow in the workspace</option>
          <option value="scoped">Only the workflow it was created for</option>
        </select>
      </label>
      <label>Secret
        <div class="secret">
          <input id="secret" type="password" autocomplete="new-password" />
          <button type="button" id="reveal">Show</button>
        </div>
        <span class="note" id="secret-note"></span>
      </label>
      <div><button class="primary" id="save" type="button" disabled>Save</button></div>
      <p id="status" role="status"></p>
    </div>
    <script>
      /* ORCHEO_BRIDGE */
    </script>
    <script>
      const $ = (id) => document.getElementById(id);
      let form = null;

      const setStatus = (text, kind = "") => {
        $("status").textContent = text;
        $("status").className = kind;
      };

      const load = (result) => {
        const data = result.structuredContent || {};
        const meta = result._meta || {};
        form = { ...data, token: meta["orcheo/formToken"] };
        const updating = Boolean(data.credential_id);
        $("title").textContent = updating ? "Update credential" : "Add credential";
        $("name").value = data.name || "";
        $("provider").value = data.provider || "";
        $("access").value = data.access || (data.workflow ? "scoped" : "shared");
        $("access").querySelector('[value="scoped"]').disabled = !data.workflow;
        form.updating = updating;
        $("secret-note").textContent = updating
          ? "Leave empty to keep the current secret."
          : "";
        $("save").disabled = !form.token;
        if (!form.token) setStatus("This form could not be verified.", "error");
      };

      $("reveal").addEventListener("click", () => {
        const input = $("secret");
        input.type = input.type === "password" ? "text" : "password";
        $("reveal").textContent = input.type === "password" ? "Show" : "Hide";
      });

      const missingField = () => {
        if (!$("name").value.trim()) return "Enter a name.";
        if (!$("provider").value.trim()) return "Enter a provider.";
        if (!form.updating && !$("secret").value) return "Enter the secret.";
        return null;
      };

      $("save").addEventListener("click", async () => {
        if (!form || !form.token) return;
        const problem = missingField();
        if (problem) {
          setStatus(problem, "error");
          return;
        }
        $("save").disabled = true;
        setStatus("Saving…");
        const args = {
          form_token: form.token,
          name: $("name").value.trim(),
          provider: $("provider").value.trim(),
          access: $("access").value,
        };
        if ($("secret").value) args.secret = $("secret").value;
        if (form.workflow) args.workflow = form.workflow;
        try {
          const result = await orcheoBridge.callTool("save_credential", args);
          const saved = result.structuredContent || {};
          $("secret").value = "";
          setStatus(`Saved “${saved.name}”.`, "success");
          await orcheoBridge.tellModel(
            `The user saved the credential "${saved.name}" (id ${saved.id}, ` +
              `provider ${saved.provider}) in the Orcheo vault.`,
          );
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          $("save").disabled = false;
        }
      });

      orcheoBridge.on("ui/notifications/tool-result", load);
      orcheoBridge.connect("orcheo-credential-form");
    </script>
  </body>
</html>
