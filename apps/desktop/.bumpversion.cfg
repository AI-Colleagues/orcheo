[bumpversion]
current_version = 0.1.4
commit = true
tag = true
tag_name = desktop-v{new_version}
message = Bump desktop version to {new_version}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:-(?P<prerel>alpha|beta|rc)\.(?P<prerel_num>\d+))?
serialize = {major}.{minor}.{patch}-{prerel}.{prerel_num}
	{major}.{minor}.{patch}

[bumpversion:part:prerel]
values = alpha
	beta
	rc
	final
optional_value = final

[bumpversion:part:prerel_num]
first_value = 1

[bumpversion:file:tauri/package.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:tauri/package-lock.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:tauri/src-tauri/tauri.conf.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:tauri/src-tauri/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:tauri/src-tauri/Cargo.lock]
search = name = "orcheo-desktop"
	version = "{current_version}"
replace = name = "orcheo-desktop"
	version = "{new_version}"

[bumpversion:file:macos/scripts/build-app.sh]
search = ORCHEO_MACOS_VERSION:-{current_version}
replace = ORCHEO_MACOS_VERSION:-{new_version}
