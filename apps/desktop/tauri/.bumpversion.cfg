[bumpversion]
current_version = 0.1.4
commit = true
tag = true
tag_name = desktop-v{new_version}
message = Bump desktop version to {new_version}

[bumpversion:file:package.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:package-lock.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:src-tauri/tauri.conf.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:src-tauri/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:src-tauri/Cargo.lock]
search = name = "orcheo-desktop"
	version = "{current_version}"
replace = name = "orcheo-desktop"
	version = "{new_version}"
