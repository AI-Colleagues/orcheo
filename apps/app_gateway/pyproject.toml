[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=67"]

[project]
dependencies = [
  "fastapi>=0.104.0",
  "httpx>=0.25.0",
  "uvicorn[standard]>=0.24.0",
  "orcheo>=0.44.4"
]
name = "orcheo-app-gateway"
requires-python = ">=3.12"
version = "0.1.0"

[project.scripts]
orcheo-app-gateway = "orcheo_app_gateway.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
orcheo = {workspace = true}
