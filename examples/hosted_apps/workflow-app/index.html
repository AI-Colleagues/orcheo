<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workflow greeting</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <h1>Workflow greeting</h1>
      <form id="message-form">
        <label for="name">Name</label>
        <input id="name" name="name" value="Ada" required>
        <div class="actions">
          <button type="submit" data-binding="greet">Greet</button>
          <button type="submit" data-binding="farewell">Say goodbye</button>
        </div>
      </form>
      <p id="result" aria-live="polite"></p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
