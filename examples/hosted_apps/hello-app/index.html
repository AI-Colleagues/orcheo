<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orcheo Hosted App Example</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">ORCHEO HOSTED APPS</p>
      <h1>Your app is live.</h1>
      <p class="lede">
        This static bundle was uploaded, validated, and published through Orcheo
        Studio.
      </p>
      <button id="celebrate" type="button">Test interaction</button>
      <p id="status" class="status" aria-live="polite">
        Waiting for a browser interaction.
      </p>
    </main>
  </body>
</html>
