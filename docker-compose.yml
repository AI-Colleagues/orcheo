name: orcheo
# Note: Services using `env_file: .env` load variables from the local `.env` file.
# Values explicitly defined under `environment` still take precedence.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${ORCHEO_POSTGRES_USER:-orcheo}
      POSTGRES_PASSWORD: ${ORCHEO_POSTGRES_PASSWORD:-orcheo}
      POSTGRES_DB: ${ORCHEO_POSTGRES_DB:-orcheo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORCHEO_POSTGRES_USER:-orcheo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "2025:2025"
    volumes:
      - .:/app
      - orcheo_data:/data
      - backend_venv:/app/.venv
      - uv_cache:/data/cache/uv
      - ./deploy/stack/chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER:-orcheo}:${ORCHEO_POSTGRES_PASSWORD:-orcheo}@postgres:5432/${ORCHEO_POSTGRES_DB:-orcheo}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWT_SECRET: ${ORCHEO_AUTH_JWT_SECRET:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-https://auth.orcheo.cloud}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-orcheo-api}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_SMTP_HOST: ${ORCHEO_SMTP_HOST:-}
      ORCHEO_SMTP_PORT: ${ORCHEO_SMTP_PORT:-587}
      ORCHEO_SMTP_USERNAME: ${ORCHEO_SMTP_USERNAME:-}
      ORCHEO_SMTP_PASSWORD: ${ORCHEO_SMTP_PASSWORD:-}
      ORCHEO_SMTP_FROM_EMAIL: ${ORCHEO_SMTP_FROM_EMAIL:-no-reply@orcheo.cloud}
      ORCHEO_SMTP_USE_TLS: ${ORCHEO_SMTP_USE_TLS:-true}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_CORS_ALLOW_ORIGINS: ${ORCHEO_CORS_ALLOW_ORIGINS:-http://localhost:2026,http://127.0.0.1:2026}
      ORCHEO_CANDIDATES_REPO: ${ORCHEO_CANDIDATES_REPO:-}
      ORCHEO_CANDIDATES_REPO_REF: ${ORCHEO_CANDIDATES_REPO_REF:-}
      ORCHEO_CANDIDATES_GITHUB_TOKEN: ${ORCHEO_CANDIDATES_GITHUB_TOKEN:-}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_WORKFLOW_TRUST_MODE: ${ORCHEO_WORKFLOW_TRUST_MODE:-allow_client_uploads}
      # Use system Python from base image instead of downloading
      UV_PYTHON_PREFERENCE: system
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uv run uvicorn orcheo_backend.app:app --host 0.0.0.0 --port 2025 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - .:/app
      - .:/workspace/agents
      - orcheo_data:/data
      - worker_venv:/app/.venv
      - uv_cache:/data/cache/uv
      - ./deploy/stack/chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER:-orcheo}:${ORCHEO_POSTGRES_PASSWORD:-orcheo}@postgres:5432/${ORCHEO_POSTGRES_DB:-orcheo}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWT_SECRET: ${ORCHEO_AUTH_JWT_SECRET:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-https://auth.orcheo.cloud}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-orcheo-api}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_SMTP_HOST: ${ORCHEO_SMTP_HOST:-}
      ORCHEO_SMTP_PORT: ${ORCHEO_SMTP_PORT:-587}
      ORCHEO_SMTP_USERNAME: ${ORCHEO_SMTP_USERNAME:-}
      ORCHEO_SMTP_PASSWORD: ${ORCHEO_SMTP_PASSWORD:-}
      ORCHEO_SMTP_FROM_EMAIL: ${ORCHEO_SMTP_FROM_EMAIL:-no-reply@orcheo.cloud}
      ORCHEO_SMTP_USE_TLS: ${ORCHEO_SMTP_USE_TLS:-true}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_CANDIDATES_REPO: ${ORCHEO_CANDIDATES_REPO:-}
      ORCHEO_CANDIDATES_REPO_REF: ${ORCHEO_CANDIDATES_REPO_REF:-}
      ORCHEO_CANDIDATES_GITHUB_TOKEN: ${ORCHEO_CANDIDATES_GITHUB_TOKEN:-}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_BACKEND_INTERNAL_URL: http://backend:2025
      ORCHEO_WORKFLOW_TRUST_MODE: ${ORCHEO_WORKFLOW_TRUST_MODE:-allow_client_uploads}
      # Use system Python from base image instead of downloading
      UV_PYTHON_PREFERENCE: system
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uv run celery -A orcheo_backend.worker.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - .:/app
      - orcheo_data:/data
      - celery_venv:/app/.venv
      - uv_cache:/data/cache/uv
      - ./deploy/stack/chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER:-orcheo}:${ORCHEO_POSTGRES_PASSWORD:-orcheo}@postgres:5432/${ORCHEO_POSTGRES_DB:-orcheo}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWT_SECRET: ${ORCHEO_AUTH_JWT_SECRET:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-https://auth.orcheo.cloud}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-orcheo-api}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_SMTP_HOST: ${ORCHEO_SMTP_HOST:-}
      ORCHEO_SMTP_PORT: ${ORCHEO_SMTP_PORT:-587}
      ORCHEO_SMTP_USERNAME: ${ORCHEO_SMTP_USERNAME:-}
      ORCHEO_SMTP_PASSWORD: ${ORCHEO_SMTP_PASSWORD:-}
      ORCHEO_SMTP_FROM_EMAIL: ${ORCHEO_SMTP_FROM_EMAIL:-no-reply@orcheo.cloud}
      ORCHEO_SMTP_USE_TLS: ${ORCHEO_SMTP_USE_TLS:-true}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_CANDIDATES_REPO: ${ORCHEO_CANDIDATES_REPO:-}
      ORCHEO_CANDIDATES_REPO_REF: ${ORCHEO_CANDIDATES_REPO_REF:-}
      ORCHEO_CANDIDATES_GITHUB_TOKEN: ${ORCHEO_CANDIDATES_GITHUB_TOKEN:-}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      # Use system Python from base image instead of downloading
      UV_PYTHON_PREFERENCE: system
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      ORCHEO_CELERY_BEAT_SCHEDULE_FILE: /data/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      sh -c 'uv run celery -A orcheo_backend.worker.celery_app beat --loglevel=info -s "$$ORCHEO_CELERY_BEAT_SCHEDULE_FILE"'

  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    env_file: .env
    ports:
      - "2026:2026"
    volumes:
      - ./apps/studio:/app
      - studio_node_modules:/app/node_modules
    environment:
      VITE_ORCHEO_BACKEND_URL: ${VITE_ORCHEO_BACKEND_URL:-http://localhost:2025}
      VITE_ORCHEO_AUTH_DISABLED: ${VITE_ORCHEO_AUTH_DISABLED:-false}
      VITE_ORCHEO_CHATKIT_DOMAIN_KEY: ${VITE_ORCHEO_CHATKIT_DOMAIN_KEY:-domain_pk_6954ef8b091c8190b0734f266b51edd00094f73ed7d04989}
      VITE_ORCHEO_ALLOWED_HOSTS: ${VITE_ORCHEO_ALLOWED_HOSTS:-}
    depends_on:
      - backend
    command: >
      sh -c 'if [ ! -d node_modules ] || [ -z "$$(ls -A node_modules 2>/dev/null)" ]; then npm ci; fi && npm run dev -- --host 0.0.0.0'

volumes:
  postgres_data:
  redis_data:
  orcheo_data:
  uv_cache:
  studio_node_modules:
  backend_venv:
  worker_venv:
  celery_venv:
