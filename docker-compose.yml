name: orcheo
# Note: Services using `env_file: .env` load variables from the local `.env` file.
# Values explicitly defined under `environment` still take precedence.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${ORCHEO_POSTGRES_USER:-orcheo}
      POSTGRES_PASSWORD: ${ORCHEO_POSTGRES_PASSWORD:-orcheo}
      POSTGRES_DB: ${ORCHEO_POSTGRES_DB:-orcheo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORCHEO_POSTGRES_USER:-orcheo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "2025:2025"
    volumes:
      - .:/app
      - orcheo_data:/data
      - backend_venv:/app/.venv
      - uv_cache:/data/cache/uv
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER:-orcheo}:${ORCHEO_POSTGRES_PASSWORD:-orcheo}@postgres:5432/${ORCHEO_POSTGRES_DB:-orcheo}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWKS_URL: ${ORCHEO_AUTH_JWKS_URL:-}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_CHATKIT_PUBLIC_BASE_URL: ${ORCHEO_CHATKIT_PUBLIC_BASE_URL:-http://localhost:2026}
      ORCHEO_CORS_ALLOW_ORIGINS: ${ORCHEO_CORS_ALLOW_ORIGINS:-http://localhost:2026,http://127.0.0.1:2026,https://orcheo-canvas.ai-colleagues.com,https://ai-colleagues.com,https://www.ai-colleagues.com}
      ORCHEO_MULTI_WORKSPACE_ENABLED: ${ORCHEO_MULTI_WORKSPACE_ENABLED:-true}
      ORCHEO_MULTI_WORKSPACE_DEFAULT_WORKSPACE_SLUG: ${ORCHEO_MULTI_WORKSPACE_DEFAULT_WORKSPACE_SLUG:-default}
      ORCHEO_MULTI_WORKSPACE_WORKSPACE_HEADER: ${ORCHEO_MULTI_WORKSPACE_WORKSPACE_HEADER:-X-Orcheo-Workspace}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      # Use system Python from base image instead of downloading
      UV_PYTHON_PREFERENCE: system
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uv run uvicorn orcheo_backend.app:app --host 0.0.0.0 --port 2025 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - .:/app
      - .:/workspace/agents
      - orcheo_data:/data
      - worker_venv:/app/.venv
      - uv_cache:/data/cache/uv
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER:-orcheo}:${ORCHEO_POSTGRES_PASSWORD:-orcheo}@postgres:5432/${ORCHEO_POSTGRES_DB:-orcheo}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWKS_URL: ${ORCHEO_AUTH_JWKS_URL:-}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_CHATKIT_PUBLIC_BASE_URL: ${ORCHEO_CHATKIT_PUBLIC_BASE_URL:-https://orcheo-canvas.ai-colleagues.com}
      ORCHEO_MULTI_WORKSPACE_ENABLED: ${ORCHEO_MULTI_WORKSPACE_ENABLED:-true}
      ORCHEO_MULTI_WORKSPACE_DEFAULT_WORKSPACE_SLUG: ${ORCHEO_MULTI_WORKSPACE_DEFAULT_WORKSPACE_SLUG:-default}
      ORCHEO_MULTI_WORKSPACE_WORKSPACE_HEADER: ${ORCHEO_MULTI_WORKSPACE_WORKSPACE_HEADER:-X-Orcheo-Workspace}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_BACKEND_INTERNAL_URL: http://backend:2025
      # Use system Python from base image instead of downloading
      UV_PYTHON_PREFERENCE: system
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uv run celery -A orcheo_backend.worker.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - .:/app
      - orcheo_data:/data
      - celery_venv:/app/.venv
      - uv_cache:/data/cache/uv
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER:-orcheo}:${ORCHEO_POSTGRES_PASSWORD:-orcheo}@postgres:5432/${ORCHEO_POSTGRES_DB:-orcheo}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWKS_URL: ${ORCHEO_AUTH_JWKS_URL:-}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_CHATKIT_PUBLIC_BASE_URL: ${ORCHEO_CHATKIT_PUBLIC_BASE_URL:-https://orcheo-canvas.ai-colleagues.com}
      ORCHEO_MULTI_WORKSPACE_ENABLED: ${ORCHEO_MULTI_WORKSPACE_ENABLED:-true}
      ORCHEO_MULTI_WORKSPACE_DEFAULT_WORKSPACE_SLUG: ${ORCHEO_MULTI_WORKSPACE_DEFAULT_WORKSPACE_SLUG:-default}
      ORCHEO_MULTI_WORKSPACE_WORKSPACE_HEADER: ${ORCHEO_MULTI_WORKSPACE_WORKSPACE_HEADER:-X-Orcheo-Workspace}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      # Use system Python from base image instead of downloading
      UV_PYTHON_PREFERENCE: system
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      ORCHEO_CELERY_BEAT_SCHEDULE_FILE: /data/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      sh -c 'uv run celery -A orcheo_backend.worker.celery_app beat --loglevel=info -s "$$ORCHEO_CELERY_BEAT_SCHEDULE_FILE"'

  canvas:
    build:
      context: .
      dockerfile: Dockerfile.canvas
    env_file: .env
    ports:
      - "2026:2026"
    volumes:
      - ./apps/canvas:/app
      - canvas_node_modules:/app/node_modules
    environment:
      VITE_ORCHEO_BACKEND_URL: ${VITE_ORCHEO_BACKEND_URL:-http://localhost:2025}
      VITE_ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-}
      VITE_ORCHEO_AUTH_CLIENT_ID: ${ORCHEO_AUTH_CLIENT_ID:-}
      VITE_ORCHEO_AUTH_REDIRECT_URI: ${VITE_ORCHEO_AUTH_REDIRECT_URI:-}
      VITE_ORCHEO_AUTH_SCOPES: ${VITE_ORCHEO_AUTH_SCOPES:-openid profile email workflows:read workflows:execute chatkit:session}
      VITE_ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-}
      VITE_ORCHEO_AUTH_ORGANIZATION: ${VITE_ORCHEO_AUTH_ORGANIZATION:-}
      VITE_ORCHEO_AUTH_PROVIDER_PARAM: ${VITE_ORCHEO_AUTH_PROVIDER_PARAM:-}
      VITE_ORCHEO_AUTH_PROVIDER_GOOGLE: ${VITE_ORCHEO_AUTH_PROVIDER_GOOGLE:-}
      VITE_ORCHEO_AUTH_PROVIDER_GITHUB: ${VITE_ORCHEO_AUTH_PROVIDER_GITHUB:-}
      VITE_ORCHEO_MULTI_WORKSPACE_WORKSPACE_HEADER: ${VITE_ORCHEO_MULTI_WORKSPACE_WORKSPACE_HEADER:-X-Orcheo-Workspace}
      VITE_ORCHEO_CHATKIT_DOMAIN_KEY: ${VITE_ORCHEO_CHATKIT_DOMAIN_KEY:-domain_pk_6954ef8b091c8190b0734f266b51edd00094f73ed7d04989}
      VITE_ORCHEO_ALLOWED_HOSTS: ${VITE_ORCHEO_ALLOWED_HOSTS:-orcheo-canvas.ai-colleagues.com}
    depends_on:
      - backend
    command: >
      sh -c 'if [ ! -d node_modules ] || [ -z "$$(ls -A node_modules 2>/dev/null)" ]; then npm ci; fi && npm run dev -- --host 0.0.0.0'

  sandbox-runtime:
    # Sole service mounting the container-runtime socket. Treat as
    # root-equivalent on the host; never expose this socket to tenant code.
    image: ${ORCHEO_SANDBOX_RUNTIME_IMAGE:-orcheo/sandbox-runtime:latest}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - sandbox_scratch:/scratch
    environment:
      ORCHEO_CONTAINER_RUNTIME: ${ORCHEO_CONTAINER_RUNTIME:-runsc}
      ORCHEO_SANDBOX_IMAGE: ${ORCHEO_SANDBOX_IMAGE:-orcheo/workspace-sandbox:latest}
      ORCHEO_EGRESS_PROXY_URL: http://egress-proxy:3128
      ORCHEO_CREDENTIAL_BROKER_URL: http://backend:2025/internal/credentials/resolve
    networks:
      - default
      - sandbox-egress

  egress-proxy:
    image: ${ORCHEO_EGRESS_PROXY_IMAGE:-envoyproxy/envoy:v1.33-latest}
    restart: unless-stopped
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ${ORCHEO_EGRESS_PROXY_CONFIG:-./deploy/stack/envoy.yaml}:/etc/envoy/envoy.yaml:ro
      - egress_audit:/var/log/orcheo
    networks:
      - sandbox-egress

networks:
  sandbox-egress:
    # nftables rules attached to this bridge enforce the L3/L4 deny policy.
    # See deploy/stack/sandbox-egress.nft.
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  orcheo_data:
  uv_cache:
  canvas_node_modules:
  backend_venv:
  worker_venv:
  celery_venv:
  sandbox_scratch:
  egress_audit:
