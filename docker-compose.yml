name: orcheo
# Note: Services using `env_file: .env` load variables from the local `.env` file.
# Values explicitly defined under `environment` still take precedence.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${ORCHEO_POSTGRES_USER:-orcheo}
      POSTGRES_PASSWORD: ${ORCHEO_POSTGRES_PASSWORD:-orcheo}
      POSTGRES_DB: ${ORCHEO_POSTGRES_DB:-orcheo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORCHEO_POSTGRES_USER:-orcheo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "2025:2025"
    volumes:
      - .:/app
      - orcheo_data:/data
      - orcheo_app_bundles:/data/app-bundles
      - backend_venv:/app/.venv
      - uv_cache:/data/cache/uv
      - ./deploy/stack/chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER:-orcheo}:${ORCHEO_POSTGRES_PASSWORD:-orcheo}@postgres:5432/${ORCHEO_POSTGRES_DB:-orcheo}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWT_SECRET: ${ORCHEO_AUTH_JWT_SECRET:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-https://auth.orcheo.cloud}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-orcheo-api}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_AUTH_BOOTSTRAP_TOKEN_SCOPES: ${ORCHEO_AUTH_BOOTSTRAP_TOKEN_SCOPES:-}
      ORCHEO_SMTP_HOST: ${ORCHEO_SMTP_HOST:-}
      ORCHEO_SMTP_PORT: ${ORCHEO_SMTP_PORT:-587}
      ORCHEO_SMTP_USERNAME: ${ORCHEO_SMTP_USERNAME:-}
      ORCHEO_SMTP_PASSWORD: ${ORCHEO_SMTP_PASSWORD:-}
      ORCHEO_SMTP_FROM_EMAIL: ${ORCHEO_SMTP_FROM_EMAIL:-no-reply@orcheo.cloud}
      ORCHEO_SMTP_USE_TLS: ${ORCHEO_SMTP_USE_TLS:-true}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_CORS_ALLOW_ORIGINS: ${ORCHEO_CORS_ALLOW_ORIGINS:-http://localhost:2026,http://127.0.0.1:2026}
      ORCHEO_CANDIDATES_REPO: ${ORCHEO_CANDIDATES_REPO:-}
      ORCHEO_CANDIDATES_REPO_REF: ${ORCHEO_CANDIDATES_REPO_REF:-}
      ORCHEO_CANDIDATES_GITHUB_TOKEN: ${ORCHEO_CANDIDATES_GITHUB_TOKEN:-}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_HOSTED_APPS_ENABLED: ${ORCHEO_HOSTED_APPS_ENABLED:-true}
      ORCHEO_APPS_BASE_DOMAIN: ${ORCHEO_APPS_BASE_DOMAIN:-apps.localhost}
      ORCHEO_APP_BUNDLE_BACKEND: ${ORCHEO_APP_BUNDLE_BACKEND:-filesystem}
      ORCHEO_APP_BUNDLE_FILESYSTEM_ROOT: /data/app-bundles
      # Local-development default only; production stack setup generates a secret.
      ORCHEO_APP_GATEWAY_SECRET: ${ORCHEO_APP_GATEWAY_SECRET:-local-development-hosted-app-gateway-secret}
      ORCHEO_HOSTED_APPS_VALIDATION_QUEUE: ${ORCHEO_HOSTED_APPS_VALIDATION_QUEUE:-hosted-app-validation}
      ORCHEO_HOSTED_APPS_AUTO_ENABLE_RUNTIME: ${ORCHEO_HOSTED_APPS_AUTO_ENABLE_RUNTIME:-true}
      ORCHEO_DEPLOYMENT_MODE: local
      ORCHEO_WORKFLOW_TRUST_MODE: ${ORCHEO_WORKFLOW_TRUST_MODE:-allow_client_uploads}
      ORCHEO_WORKFLOW_DEFINITION_MODE: ${ORCHEO_WORKFLOW_DEFINITION_MODE:-unrestricted}
      # Use system Python from base image instead of downloading
      UV_PYTHON_PREFERENCE: system
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2025/api/system/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: uv run uvicorn orcheo_backend.app:app --host 0.0.0.0 --port 2025 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - .:/app
      - .:/workspace/agents
      - orcheo_data:/data
      - worker_venv:/app/.venv
      - uv_cache:/data/cache/uv
      - ./deploy/stack/chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER:-orcheo}:${ORCHEO_POSTGRES_PASSWORD:-orcheo}@postgres:5432/${ORCHEO_POSTGRES_DB:-orcheo}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWT_SECRET: ${ORCHEO_AUTH_JWT_SECRET:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-https://auth.orcheo.cloud}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-orcheo-api}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_SMTP_HOST: ${ORCHEO_SMTP_HOST:-}
      ORCHEO_SMTP_PORT: ${ORCHEO_SMTP_PORT:-587}
      ORCHEO_SMTP_USERNAME: ${ORCHEO_SMTP_USERNAME:-}
      ORCHEO_SMTP_PASSWORD: ${ORCHEO_SMTP_PASSWORD:-}
      ORCHEO_SMTP_FROM_EMAIL: ${ORCHEO_SMTP_FROM_EMAIL:-no-reply@orcheo.cloud}
      ORCHEO_SMTP_USE_TLS: ${ORCHEO_SMTP_USE_TLS:-true}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_CANDIDATES_REPO: ${ORCHEO_CANDIDATES_REPO:-}
      ORCHEO_CANDIDATES_REPO_REF: ${ORCHEO_CANDIDATES_REPO_REF:-}
      ORCHEO_CANDIDATES_GITHUB_TOKEN: ${ORCHEO_CANDIDATES_GITHUB_TOKEN:-}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      ORCHEO_BACKEND_INTERNAL_URL: http://backend:2025
      ORCHEO_WORKFLOW_TRUST_MODE: ${ORCHEO_WORKFLOW_TRUST_MODE:-allow_client_uploads}
      ORCHEO_WORKFLOW_DEFINITION_MODE: ${ORCHEO_WORKFLOW_DEFINITION_MODE:-unrestricted}
      # Use system Python from base image instead of downloading
      UV_PYTHON_PREFERENCE: system
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uv run celery -A orcheo_backend.worker.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - .:/app
      - orcheo_data:/data
      - celery_venv:/app/.venv
      - uv_cache:/data/cache/uv
      - ./deploy/stack/chatkit_widgets:/app/examples/chatkit_widgets/widgets:ro
    environment:
      HOME: /data/home
      CODEX_HOME: /data/home/.codex
      CLAUDE_CONFIG_DIR: /data/home/.claude
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER:-orcheo}:${ORCHEO_POSTGRES_PASSWORD:-orcheo}@postgres:5432/${ORCHEO_POSTGRES_DB:-orcheo}
      ORCHEO_VAULT_ENCRYPTION_KEY: ${ORCHEO_VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ORCHEO_AUTH_MODE: ${ORCHEO_AUTH_MODE:-required}
      ORCHEO_AUTH_JWT_SECRET: ${ORCHEO_AUTH_JWT_SECRET:-}
      ORCHEO_AUTH_ISSUER: ${ORCHEO_AUTH_ISSUER:-https://auth.orcheo.cloud}
      ORCHEO_AUTH_AUDIENCE: ${ORCHEO_AUTH_AUDIENCE:-orcheo-api}
      ORCHEO_AUTH_DEV_LOGIN_ENABLED: ${ORCHEO_AUTH_DEV_LOGIN_ENABLED:-false}
      ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN: ${ORCHEO_AUTH_BOOTSTRAP_SERVICE_TOKEN:-}
      ORCHEO_SMTP_HOST: ${ORCHEO_SMTP_HOST:-}
      ORCHEO_SMTP_PORT: ${ORCHEO_SMTP_PORT:-587}
      ORCHEO_SMTP_USERNAME: ${ORCHEO_SMTP_USERNAME:-}
      ORCHEO_SMTP_PASSWORD: ${ORCHEO_SMTP_PASSWORD:-}
      ORCHEO_SMTP_FROM_EMAIL: ${ORCHEO_SMTP_FROM_EMAIL:-no-reply@orcheo.cloud}
      ORCHEO_SMTP_USE_TLS: ${ORCHEO_SMTP_USE_TLS:-true}
      ORCHEO_STUDIO_URL: ${ORCHEO_STUDIO_URL:-http://localhost:2026}
      ORCHEO_CANDIDATES_REPO: ${ORCHEO_CANDIDATES_REPO:-}
      ORCHEO_CANDIDATES_REPO_REF: ${ORCHEO_CANDIDATES_REPO_REF:-}
      ORCHEO_CANDIDATES_GITHUB_TOKEN: ${ORCHEO_CANDIDATES_GITHUB_TOKEN:-}
      ORCHEO_PLUGIN_DIR: /data/plugins
      ORCHEO_CACHE_DIR: /data/cache/orcheo
      # Use system Python from base image instead of downloading
      UV_PYTHON_PREFERENCE: system
      ORCHEO_MCP_STDIO_LOG: /dev/stderr
      ORCHEO_CELERY_BEAT_SCHEDULE_FILE: /data/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      sh -c 'uv run celery -A orcheo_backend.worker.celery_app beat --loglevel=info -s "$$ORCHEO_CELERY_BEAT_SCHEDULE_FILE"'

  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    env_file: .env
    ports:
      - "2026:2026"
    volumes:
      - ./apps/studio:/app
      - studio_node_modules:/app/node_modules
    environment:
      VITE_ORCHEO_BACKEND_URL: ${VITE_ORCHEO_BACKEND_URL:-http://localhost:2025}
      VITE_ORCHEO_AUTH_DISABLED: ${VITE_ORCHEO_AUTH_DISABLED:-false}
      VITE_ORCHEO_CHATKIT_DOMAIN_KEY: ${VITE_ORCHEO_CHATKIT_DOMAIN_KEY:-domain_pk_6954ef8b091c8190b0734f266b51edd00094f73ed7d04989}
      VITE_ORCHEO_ALLOWED_HOSTS: ${VITE_ORCHEO_ALLOWED_HOSTS:-}
      VITE_ORCHEO_APPS_BASE_DOMAIN: ${ORCHEO_APPS_BASE_DOMAIN:-apps.localhost}
      VITE_ORCHEO_APPS_PORT: ${ORCHEO_APP_GATEWAY_PORT:-2030}
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c 'if [ ! -d node_modules ] || [ -z "$$(ls -A node_modules 2>/dev/null)" ]; then npm ci; fi && npm run dev -- --host 0.0.0.0'

  app-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "${ORCHEO_APP_GATEWAY_PORT:-2030}:2030"
    volumes:
      - .:/app
      - orcheo_app_bundles:/data/app-bundles:ro
      - app_gateway_venv:/app/.venv
      - uv_cache:/data/cache/uv
    environment:
      HOME: /data/home
      UV_CACHE_DIR: /data/cache/uv
      ORCHEO_HOSTED_APPS_ENABLED: ${ORCHEO_HOSTED_APPS_ENABLED:-true}
      ORCHEO_APPS_BASE_DOMAIN: ${ORCHEO_APPS_BASE_DOMAIN:-apps.localhost}
      ORCHEO_APP_BUNDLE_FILESYSTEM_ROOT: /data/app-bundles
      ORCHEO_APP_GATEWAY_BACKEND_URL: http://backend:2025
      ORCHEO_APP_GATEWAY_SECRET: ${ORCHEO_APP_GATEWAY_SECRET:-local-development-hosted-app-gateway-secret}
      ORCHEO_APP_DESCRIPTOR_CACHE_SECONDS: ${ORCHEO_APP_DESCRIPTOR_CACHE_SECONDS:-30}
      ORCHEO_APP_TRUSTED_PROXY_CIDRS: ${ORCHEO_APP_TRUSTED_PROXY_CIDRS:-}
      ORCHEO_APP_TRUSTED_PROXY_HOPS: ${ORCHEO_APP_TRUSTED_PROXY_HOPS:-0}
      UV_PYTHON_PREFERENCE: system
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'case "$$ORCHEO_HOSTED_APPS_ENABLED" in 1|true|yes) endpoint=readyz ;; *) endpoint=healthz ;; esac; curl -fsS "http://localhost:2030/$$endpoint" > /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      uv run --package orcheo-app-gateway uvicorn
      orcheo_app_gateway.main:create_app --factory
      --host 0.0.0.0 --port 2030 --reload

  validation-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - .:/app
      - orcheo_app_bundles:/data/app-bundles
      - validation_worker_venv:/app/.venv
      - uv_cache:/data/cache/uv
    environment:
      HOME: /data/home
      UV_CACHE_DIR: /data/cache/uv
      REDIS_URL: redis://redis:6379/0
      ORCHEO_POSTGRES_DSN: postgresql://${ORCHEO_POSTGRES_USER:-orcheo}:${ORCHEO_POSTGRES_PASSWORD:-orcheo}@postgres:5432/${ORCHEO_POSTGRES_DB:-orcheo}
      ORCHEO_HOSTED_APPS_ENABLED: ${ORCHEO_HOSTED_APPS_ENABLED:-true}
      ORCHEO_HOSTED_APPS_VALIDATION_QUEUE: ${ORCHEO_HOSTED_APPS_VALIDATION_QUEUE:-hosted-app-validation}
      ORCHEO_APP_BUNDLE_BACKEND: ${ORCHEO_APP_BUNDLE_BACKEND:-filesystem}
      ORCHEO_APP_BUNDLE_FILESYSTEM_ROOT: /data/app-bundles
      ORCHEO_DEPLOYMENT_MODE: local
      UV_PYTHON_PREFERENCE: system
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      sh -c 'uv run celery -A orcheo_backend.worker.celery_app worker
      --loglevel=info
      --queues="$$ORCHEO_HOSTED_APPS_VALIDATION_QUEUE"
      --concurrency=1'

  hosted-app-cleanup:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - .:/app
      - orcheo_app_bundles:/data/app-bundles
      - hosted_app_cleanup_venv:/app/.venv
      - uv_cache:/data/cache/uv
    environment:
      HOME: /data/home
      UV_CACHE_DIR: /data/cache/uv
      ORCHEO_APP_BUNDLE_FILESYSTEM_ROOT: /data/app-bundles
      ORCHEO_HOSTED_APPS_PARTIAL_RETENTION_SECONDS: ${ORCHEO_HOSTED_APPS_PARTIAL_RETENTION_SECONDS:-86400}
      ORCHEO_HOSTED_APPS_CLEANUP_INTERVAL_SECONDS: ${ORCHEO_HOSTED_APPS_CLEANUP_INTERVAL_SECONDS:-900}
      UV_PYTHON_PREFERENCE: system
      PYTHONUNBUFFERED: "1"
    command: uv run python -m orcheo_backend.app.hosted_apps.cleanup

volumes:
  postgres_data:
  redis_data:
  orcheo_data:
  orcheo_app_bundles:
  uv_cache:
  studio_node_modules:
  backend_venv:
  worker_venv:
  celery_venv:
  app_gateway_venv:
  validation_worker_venv:
  hosted_app_cleanup_venv:
