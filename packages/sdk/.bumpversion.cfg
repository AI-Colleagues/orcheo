[bumpversion]
current_version = 0.33.4
commit = true
tag = true
tag_name = sdk-v{new_version}
message = Bump sdk version to {new_version}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:(?P<prerel>a|b|rc)(?P<prerel_num>\d+))?
serialize = {major}.{minor}.{patch}{prerel}{prerel_num}
	{major}.{minor}.{patch}

[bumpversion:part:prerel]
values = a
	b
	rc
	final
optional_value = final

[bumpversion:part:prerel_num]
first_value = 1

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:../../uv.lock]
search = [[package]]
	name = "orcheo-sdk"
	version = "{current_version}"
replace = [[package]]
	name = "orcheo-sdk"
	version = "{new_version}"
