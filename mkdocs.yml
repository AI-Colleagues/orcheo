site_name: Orcheo
site_description: Workflow orchestration platform designed for vibe coding
site_url: https://orcheo.readthedocs.io
repo_url: https://github.com/AI-Colleagues/orcheo
repo_name: AI-Colleagues/orcheo

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Manual Setup: manual_setup.md
      - Studio: studio.md
      - Environment Variables: environment_variables.md
      - Authentication: authentication_guide.md
      - First-party Auth Rollout: first_party_auth_rollout.md
      - Lark App Setup: integrations/lark_app_setup.md
      - LinkedIn Credentials Setup: integrations/linkedin_credentials_setup.md
      - Connect a Coding Agent: connect_coding_agent.md
  - Examples:
      - Conversational Search: examples/conversational_search.md
      - Evaluation: examples/evaluation.md
  - Deployment:
      - Overview: deployment.md
      - Execution Worker: execution_worker/deployment.md
  - Chatkit Integration:
      - Workflow Publishing: chatkit_integration/workflow_publish_guide.md
      - Chat Bubble: chatkit_integration/studio_chat_bubble_guide.md
      - Webpage Embedding: chatkit_integration/webpage_embedding_guide.md
      - Custom Chat UI: chatkit_integration/custom_chat_ui_guide.md
  - Development:
      - Developer Guide: developer_guide.md
      - Developer Tooling: developer_tooling.md
      - Plugin Tutorial: plugin_tutorial.md
      - Plugin Reference: custom_nodes_and_tools.md
      - Sandboxed Custom Workflows: sandboxed_custom_workflows.md
      - Releasing: releasing.md
  - Reference:
      - Node Catalog: node_catalog.md
      - CLI Coding-Agent Nodes: cli_agent_nodes.md
      - Workflow Config Annotations: workflow_config_annotations.md
      - CLI Reference: cli_reference.md
      - SDK Reference: sdk_reference.md
      - OpenTelemetry Tracing: otel_tracing/README.md
      - Agentensor Runbook: agentensor/runbook.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
  - mkdocs-jupyter:
      include_source: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
